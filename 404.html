<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 | Mohammad Khoddami</title>
  <meta name="robots" content="noindex" />

  <meta name="theme-color" content="#0b0a09" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230b0a09'/%3E%3Ctext x='50' y='66' font-family='monospace' font-size='52' font-weight='500' text-anchor='middle' fill='%23f8f5f1'%3EM%3C/text%3E%3Ccircle cx='78' cy='78' r='6' fill='%23d9ab77'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
        if ((stored || (prefersLight ? 'light' : 'dark')) === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="/styles.css" />
  <style>
    .nf{min-height:84vh;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;
      max-width:60ch;padding:3rem 0}
    .nf-code{font-weight:600;font-size:clamp(4.5rem,16vw,10rem);line-height:.88;letter-spacing:-.055em;
      color:var(--tx-1);margin-bottom:1.5rem}
    .nf-code em{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--accent)}
    .nf p{color:var(--tx-3);font-size:1.0625rem;line-height:1.6;margin-bottom:2rem;max-width:46ch}
    .nf a{display:inline-block;font-family:var(--mono);font-size:.8125rem;color:var(--tx-1);
      border-bottom:1px solid var(--bd-2);padding-bottom:.28rem;
      transition:color var(--dur) var(--ease),border-color var(--dur) var(--ease)}
    .nf a:hover,.nf a:focus-visible{color:var(--accent);border-color:var(--accent)}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="nf">
      <span class="lbl">Error</span>
      <p class="nf-code">4<em>0</em>4</p>
      <p>This page doesn't exist. Or it did once, in a previous version of this site. Either way, it's gone now.</p>
      <a href="/">&larr; Back home</a>
    </section>
  </main>
</body>
</html>
